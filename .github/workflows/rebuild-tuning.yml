name: rebuild tuning workbook

on:
  push:
    paths:
      - '.tuning-upload/**'
      - '.github/workflows/rebuild-tuning.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild workbook
        run: |
          mkdir -p measurement/tuning
          cat .tuning-upload/part_* > /tmp/power_alg_thr_tunning.b64
          base64 -d /tmp/power_alg_thr_tunning.b64 > measurement/tuning/power_alg_thr_tunning.xlsx
          unzip -t measurement/tuning/power_alg_thr_tunning.xlsx
      - name: Commit workbook
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add measurement/tuning/power_alg_thr_tunning.xlsx
          git diff --cached --quiet && exit 0
          git commit -m "Update power threshold tuning workbook"
          git push
